# Render Blueprint for the Calen API.
# Dashboard → New + → Blueprint → connect this repo; Render reads this file.
# Secrets marked `sync: false` are entered in the Render UI, never committed.
services:
  # Marketing/legal static site at householdcalendar.com (terms + privacy are
  # App Store review requirements; the paywall and email CTAs link here).
  - type: web
    runtime: static
    name: household-calendar-web
    rootDir: static
    buildCommand: ""
    staticPublishPath: .
    domains:
      - householdcalendar.com
      - www.householdcalendar.com
    routes:
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
    headers:
      # Apple's associated-domains CDN requires the AASA file be served as JSON.
      # It has no extension, so pin the type (webcredentials = passkey sign-in /
      # Face ID unlock; the file lists <TeamID>.<bundleId> for the mobile app).
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
      # --- baseline security headers (three static pages, no third-party JS) ---
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # `script-src 'unsafe-inline'` covers the one inline block on the site —
      # the JSON-LD in index.html. A hash would be tighter but silently breaks
      # structured data the next time that block is edited, and with no external
      # script origin allowed there is nothing here for an inline script to load.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
      # --- caching: icons are regenerated rarely (npm run web:icons) ---
      - path: /*.png
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=604800
      - path: /favicon.ico
        name: Cache-Control
        value: public, max-age=604800
      # The stylesheet is unversioned, so keep it short enough that a copy edit
      # to the site is live the same day.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate

  - type: web
    name: household-calendar-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # --- outbound email (Migadu, services/mailer.js) ---
      - key: SMTP_HOST
        value: smtp.migadu.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: no-reply@householdcalendar.com
      - key: MAIL_FROM
        value: Calen <no-reply@householdcalendar.com>
      # --- support inbox in the admin app (Migadu, services/supportMail.js) ---
      - key: SUPPORT_EMAIL_USER
        value: support@householdcalendar.com
      # App-download links in email CTAs — set store URLs once the listings exist
      - key: APP_STORE_URL
        sync: false
      - key: PLAY_STORE_URL
        sync: false
      - key: WEB_URL
        value: https://householdcalendar.com
      # --- passkey sign-in (routes/authPasskey.js) ---
      # RP ID must match the mobile app's PASSKEY_RP_ID and the domain serving
      # the AASA/assetlinks association files. PASSKEY_ORIGINS defaults to
      # https://<rp-id> (what iOS asserts from); append the Android
      # android:apk-key-hash:<hash> origin (comma-separated) for Play builds.
      - key: PASSKEY_RP_ID
        value: householdcalendar.com
      # --- mandatory E2EE (§9) ---
      # Minimum app version that always sends record ciphertext. The drop-readiness
      # gate blocks a household with any member on a pre-mandate build below this.
      - key: E2EE_MIN_APP_VERSION
        value: 1.0.0
      # --- secrets / set in the Render dashboard ---
      - key: MONGODB_URI
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SUPPORT_EMAIL_PASS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      # --- optional feature keys (leave blank to disable that feature) ---
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: BRAVE_SEARCH_KEY
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false
